server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

app:
  cache:
    hot-targets:
      brand-id-range:
        min: 1
        max: 10000
        count: 500  # Hot 브랜드 ID 개수 (min~max 범위에서 랜덤 선택)
      product-id-range:
        min: 1
        max: 100000
        count: 5000  # Hot 상품 ID 개수 (min~max 범위에서 랜덤 선택)
      hot-page-range: 3  # Hot Page 범위 (1~N 페이지, 0-based이므로 0~N-1 페이지가 Hot)
    ttl:
      list-seconds: 60  # 목록 캐시 TTL (1분)
      info-seconds: 3600  # 상품 정보 캐시 TTL (1시간)
      stat-seconds: 60  # 통계 캐시 TTL (1분)

# Resilience4J Circuit Breaker 설정
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 100
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true

# Feign Client 설정
feign:
  circuitbreaker:
    enabled: true  # Resilience4J Circuit Breaker 활성화
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
        logger-level: basic

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false