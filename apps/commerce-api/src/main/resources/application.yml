server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml
      - kafka.yml
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          pg-client:
            connect-timeout: 3000                 # 3초: TCP 연결 + 네트워크 버퍼
            read-timeout: 10000                   # 10초: 카카오페이 권장 참고

pg-client:
  base-url: http://localhost:8082
  callback-url: http://localhost:8080/api/v1/payments/callback

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

outbox:
  topics:
    catalog-events: catalog-events
    order-events: order-events
  relay:
    batch-size: 500
    max-retry: 2
    lease-duration: 30s
    fixed-delay: 200
    retry-backoff:
      - 1s
      - 2s

resilience4j:
  circuitbreaker:
    instances:
      pg-client:
        sliding-window-size: 30                   # 30초: TPS 100 기준, 새벽 300건
        sliding-window-type: TIME_BASED           # 트래픽 변동 대응
        failure-rate-threshold: 30                # 30%: 민감하게
        slow-call-duration-threshold: 6s          # 6초: p99(5초) × 1.2
        slow-call-rate-threshold: 1.3             # 1.3%: p99 비율 × 1.3
        wait-duration-in-open-state: 5s           # 5초: 30초 내 6번 복구 시도
        minimum-number-of-calls: 10               # 10건: 초기 섣부른 판단 방지
        permitted-number-of-calls-in-half-open-state: 3  # Half-Open 테스트 3건
        ignore-exceptions:
          - feign.FeignException$BadRequest       # 400
          - feign.FeignException$Unauthorized     # 401
          - feign.FeignException$Forbidden        # 403
          - feign.FeignException$NotFound         # 404
      redis-cache:
        sliding-window-size: 10                   # 10초: 빠른 감지
        sliding-window-type: TIME_BASED           # 트래픽 변동 대응
        failure-rate-threshold: 30                # 30%: 인프라 장애는 민감하게
        slow-call-duration-threshold: 500ms       # 500ms: Redis는 빨라야 함
        slow-call-rate-threshold: 50              # 50%: slow call은 관대하게
        wait-duration-in-open-state: 5s           # 5초: 빠른 복구 시도
        minimum-number-of-calls: 5                # 5건: 빠른 판단
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.loopers.cache.CacheSerializationException  # 직렬화 실패는 우리 코드 문제
  timelimiter:
    instances:
      pg-client:
        timeout-duration: 12s                     # 12초: read-timeout + 예비 안전망

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false